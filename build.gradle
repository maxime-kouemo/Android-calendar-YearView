// Root build script.
//
// Every plugin used anywhere in this build is declared here once with `apply false`,
// which puts it on the build classpath a single time and lets the subprojects apply it
// without repeating a version. Without this, Gradle warns:
//
//   The Kotlin Gradle plugin was loaded multiple times in different subprojects, which
//   is not supported and may break the build.
//   The Kotlin plugin was loaded in the following projects: ':compose', ':core', ':legacy'
//
// The root project itself needs none of them, hence `apply false` throughout.
plugins {
    alias(libs.plugins.com.android.application) apply false
    alias(libs.plugins.com.android.library) apply false
    alias(libs.plugins.org.jetbrains.kotlin.android) apply false
    alias(libs.plugins.kotlin.parcelize) apply false
    alias(libs.plugins.compose.compiler) apply false
    alias(libs.plugins.binary.compatibility.validator) apply false
}
