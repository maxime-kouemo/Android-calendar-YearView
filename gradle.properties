# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Sun Jan 19 13:36:16 EST 2025
android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
org.gradle.daemon=true

# ?????????????????????????????????????????????????????????????????????????????
# Published Maven coordinates ? single source of truth for :core, :legacy, :compose
# ?????????????????????????????????????????????????????????????????????????????

# The group deliberately mirrors the coordinate JitPack serves for a multi-module
# repository, `com.github.<user>.<repo>`, rather than a vanity group.
#
# :legacy and :compose both declare `api(project(":core"))`. Gradle writes that into
# their published POMs as a real Maven coordinate, so the group has to be one that
# actually resolves for a consumer. Publishing under `com.mamboa.yearview` while
# JitPack served the artifacts as `com.github.maxime-kouemo.Android-calendar-YearView`
# meant every consumer of :legacy or :compose failed with
# `Could not find com.mamboa.yearview:core` ? the whole public API is expressed in
# `core` types, so the AAR was unusable.
GROUP_ID=com.github.maxime-kouemo.Android-calendar-YearView

# Must match the git tag being released. JitPack derives the version from the tag and
# then looks for exactly that version in the local Maven repository, so a mismatch
# produces an "artifact not found" even when the build itself is green. A `-Pversion=`
# on the command line overrides this value.
VERSION_NAME=1.0.1